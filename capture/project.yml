name: MadoribaCapture

options:
  bundleIdPrefix: madoriba
  deploymentTarget:
    iOS: "16.0"   # ARFrame.exifData が iOS 16+
  createIntermediateGroups: true

targets:
  MadoribaCapture:
    type: application
    platform: iOS
    sources:
      - Sources
      # TestFlight / App Store Connect はアイコン必須。無いと配信できない。
      - Assets.xcassets
      - path: Vendor/xatlas
        # xatlas は依存のない単一ファイルの C++。警告は抑える（自前のコードではない）。
        #
        # **Debug でも -O2 で通す。** 焼き込み時間の 97% が xatlas の UV 展開で、
        # Debug の GCC_OPTIMIZATION_LEVEL = 0 では実測 6.5 倍遅くなる
        # （room-33d49373 の 148,897 面で -O0 49.62 秒 / -O2 7.68 秒）。
        # 外部の数値コードを段階実行することはないので、最適化を落とす利点がない。
        # 構成ごとの設定より後に付くので、こちらが勝つ。
        #
        # **`-DXA_MULTITHREADED=0` で単一スレッド版にする。**
        # マルチスレッド版の `TaskScheduler::wait` は
        # `while (group.ref > 0) std::this_thread::yield();` のスピン待機で、
        # 実測で CPU 1490 秒 / 壁時計 249 秒（6 コア常時稼働）のうち、
        # 実作業は Mac 換算 80 CPU 秒程度。**約 95% が空回り**だった。
        # **単一スレッドにする。この端末では並列が効かない。**
        #
        # 実測（iPad8,11）:
        #
        #     設定              展開      µs/面   CPU/壁時計   CPU µs/面
        #     既定 7 ワーカ    249 s     1158       6.0         6948
        #     ワーカ上限 3      61 s      382       3.97        1517
        #     単一スレッド      55 s      332       1.24          412
        #
        # ワーカ 3 は **CPU を 3.7 倍使って速度 0.87 倍**。追加スレッドは
        # 何も生んでいない。SoC の電力枠が固定で、コアを増やすと 1 コアの
        # クロックが落ちるためと見ている（`thermal_state` は nominal のまま）。
        # 端末の単一スレッド性能は正常（Mac の 2.3 倍で A12Z として妥当）。
        #
        # Mac では並列が効く（単一 34.5 秒 / 3 ワーカ 16.3 秒）。`XA_WORKER_CAP`
        # の実装は残してあるので、並列が効く端末では `-DXA_WORKER_CAP=3` に
        # 差し替えればよい。
        compilerFlags: "-w -O2 -DXA_MULTITHREADED=0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: madoriba.capture
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"        # iPad のみ
        SWIFT_VERSION: "5.0"
        # XcodeGen の既定は CODE_SIGN_IDENTITY = "iPhone Developer" だが、
        # これは Xcode 11 世代で非推奨になった旧称。現行は "Apple Development"。
        # 旧称のままだと署名 UI が正しく動かず、Team が選べないことがある。
        # Objective-C++ ブリッジ経由で C++ の xatlas を使う
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/BridgingHeader.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/xatlas"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        # Xcode の GUI で選んだ Team は .xcodeproj に書かれるため
        # xcodegen generate で消える。ここに書いて恒久化する。
        # **madoriba チーム。個人チーム（5ND4753AQ6）から移した。**
        # 無料の Personal Team はプロファイルが 7 日で切れ、毎週リビルドと
        # 端末での「信頼」のやり直しが要っていた。チーム配布の前提条件。
        DEVELOPMENT_TEAM: NMK3USW785
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: madoriba capture
        # 独自の暗号は実装していない（OS 標準の範囲のみ）。未設定だと
        # App Store Connect がビルドごとに輸出コンプライアンスを聞いてくる。
        ITSAppUsesNonExemptEncryption: false
        # **版は project.yml で管理する。** 生成された Info.plist に 1.0 / 1 が
        # 直書きされていて、MARKETING_VERSION を上げても反映されていなかった。
        # TestFlight は同じ CFBundleVersion を 2 回受け付けないので、
        # 上げ忘れるとアップロードが弾かれる。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # LiDAR スキャンにカメラを使う
        NSCameraUsageDescription: 室内をスキャンして 3D 復元するためにカメラを使用します。
        # Documents を Files アプリに露出させ、AirDrop / USB で Mac にコピーできるようにする。
        # ストリーミング転送 (Phase 4) を実装するまではこれが唯一の取り出し口。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  MadoribaCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    # 実データ（room.json）を焼き込んで、移植した幾何が Python と同じ数値を
    # 出すか検証する。CapturedRoom は Codable なのでそのまま復元できる。
    resources:
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MadoribaCapture
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MadoribaCapture.app/MadoribaCapture"
        BUNDLE_LOADER: "$(TEST_HOST)"
