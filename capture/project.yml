name: MadoribaCapture

options:
  bundleIdPrefix: com.garnet.madoriba
  deploymentTarget:
    iOS: "16.0"   # ARFrame.exifData が iOS 16+
  createIntermediateGroups: true

targets:
  MadoribaCapture:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Vendor/xatlas
        # xatlas は依存のない単一ファイルの C++。警告は抑える（自前のコードではない）。
        #
        # **Debug でも -O2 で通す。** 焼き込み時間の 97% が xatlas の UV 展開で、
        # Debug の GCC_OPTIMIZATION_LEVEL = 0 では実測 6.5 倍遅くなる
        # （room-33d49373 の 148,897 面で -O0 49.62 秒 / -O2 7.68 秒）。
        # 外部の数値コードを段階実行することはないので、最適化を落とす利点がない。
        # 構成ごとの設定より後に付くので、こちらが勝つ。
        compilerFlags: "-w -O2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garnet.madoriba.capture
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"        # iPad のみ
        SWIFT_VERSION: "5.0"
        # XcodeGen の既定は CODE_SIGN_IDENTITY = "iPhone Developer" だが、
        # これは Xcode 11 世代で非推奨になった旧称。現行は "Apple Development"。
        # 旧称のままだと署名 UI が正しく動かず、Team が選べないことがある。
        # Objective-C++ ブリッジ経由で C++ の xatlas を使う
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/BridgingHeader.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/xatlas"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        # Xcode の GUI で選んだ Team は .xcodeproj に書かれるため
        # xcodegen generate で消える。ここに書いて恒久化する。
        DEVELOPMENT_TEAM: 5ND4753AQ6
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: madoriba capture
        UILaunchScreen: {}
        # LiDAR スキャンにカメラを使う
        NSCameraUsageDescription: 室内をスキャンして 3D 復元するためにカメラを使用します。
        # 間取り図に真北を入れるため。ARKit の .gravityAndHeading は磁気コンパスを
        # 使い、位置情報の許可が無いと方位を確立できない。
        NSLocationWhenInUseUsageDescription: 間取り図に方位（真北）を記入するため、コンパスを使用します。
        # Documents を Files アプリに露出させ、AirDrop / USB で Mac にコピーできるようにする。
        # ストリーミング転送 (Phase 4) を実装するまではこれが唯一の取り出し口。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  MadoribaCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    # 実データ（room.json）を焼き込んで、移植した幾何が Python と同じ数値を
    # 出すか検証する。CapturedRoom は Codable なのでそのまま復元できる。
    resources:
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MadoribaCapture
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MadoribaCapture.app/MadoribaCapture"
        BUNDLE_LOADER: "$(TEST_HOST)"
