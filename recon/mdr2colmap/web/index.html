<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>madoriba — スキャン管理</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="list">
    <div class="list-head">
      <h1>スキャン</h1>
      <button id="reload" title="読み直す">↻</button>
    </div>
    <div id="scans" class="scans"><p class="empty">読み込み中…</p></div>
    <p class="root" id="root"></p>
  </aside>

  <main class="detail">
    <div id="placeholder" class="placeholder">
      <p>左の一覧からスキャンを選んでください。</p>
    </div>

    <div id="content" hidden>
      <header class="head">
        <div>
          <h2 id="title">—</h2>
          <p id="subtitle" class="sub">—</p>
        </div>
        <div class="badges" id="badges"></div>
      </header>

      <div class="panes">
        <section class="pane">
          <div class="pane-head">
            <span>平面図</span>
            <span class="muted" id="plan-source"></span>
          </div>
          <div class="stage"><svg id="plan"></svg></div>
        </section>
        <section class="pane">
          <div class="pane-head">
            <span>3D</span>
            <span class="tools">
              <button id="vTop">上から</button>
              <button id="vIso">斜め</button>
            </span>
          </div>
          <div class="stage view"><canvas id="gl"></canvas>
            <p class="loading" id="gl-note">選択すると読み込みます</p></div>
        </section>
      </div>

      <div class="bar">
        <button id="rotL" disabled>⟲ 15°</button>
        <button id="rotR" disabled>⟳ 15°</button>
        <button id="rot90" disabled>90°</button>
        <button id="resetOne" disabled>選択を戻す</button>
        <label><input type="checkbox" id="snap" checked> 50mm 刻み</label>
        <span class="spacer"></span>
        <span class="muted" id="hint">家具をドラッグ・矢印キー・[ ] で回転</span>
        <button id="resetAll">全部戻す</button>
        <button id="save" class="primary" disabled>保存して 3D に反映</button>
      </div>
      <p class="status" id="status"></p>

      <div class="cols">
        <section>
          <h3>家具</h3>
          <table id="objects"><thead><tr>
            <th>家具</th><th>寸法 mm</th><th>Δx</th><th>Δz</th><th>Δ回転</th>
          </tr></thead><tbody></tbody></table>
        </section>
        <section>
          <h3>諸元</h3>
          <dl class="facts" id="facts"></dl>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
