[project]
name = "mdr2colmap"
version = "0.1.0"
description = "MDR バンドル (iPadOS ARKit キャプチャ) を COLMAP モデル + LiDAR 初期点群に変換する"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
    "scipy>=1.10",
]

[project.scripts]
mdr2colmap = "mdr2colmap.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdr2colmap"]
