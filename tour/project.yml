name: MadoribaTour

options:
  bundleIdPrefix: com.garnet.madoriba
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MetalSplatter:
    path: ../vendor/MetalSplatter

targets:
  MadoribaTour:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garnet.madoriba.tour
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5ND4753AQ6
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: madoriba tour
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "15.0"
